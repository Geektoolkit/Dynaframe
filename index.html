<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07130f">
<title>Dynaframe Theme Wash</title>
<style>
:root{--ms:460ms;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#05060a}body{min-height:100svh}
#app,.clone{position:fixed;inset:0;z-index:99;pointer-events:none;overflow:hidden;contain:paint;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform:translateZ(0);will-change:clip-path,opacity}
.clone header,.clone .controls,.clone footer,.clone .drawer{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
.clone .content{will-change:transform}
.transition-setting{margin-top:14px;border:1px solid var(--line);border-radius:16px;padding:14px;background:rgba(0,0,0,.08)}
.transition-setting label{display:block;color:var(--muted);font-size:13px;margin-bottom:8px}
.transition-setting select{width:100%;min-height:46px;border:1px solid var(--line);border-radius:13px;padding:0 12px;background:rgba(0,0,0,.22);color:var(--text);font:700 15px system-ui,-apple-system,sans-serif;outline:none}
.transition-setting select:focus{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 20%,transparent)}
.transition-desc{color:var(--muted);font-size:12px;line-height:1.4;margin-top:8px}
@media(max-width:380px){.content{padding-left:15px;padding-right:15px}.row{gap:6px}.ctrl{height:56px}.brand span{letter-spacing:.14em}}
</style>
</head>
<body>
<main id="app" data-theme="forest"><div class="shell">
<header><div class="brand"><div class="logo"></div><span>Dynaframe™</span></div><button class="menu" id="menu">☰</button></header>
<section class="content">
<div class="title"><div class="icon">▣</div><h1>Now Playing</h1></div>
<div class="card"><button class="icon info">i</button><div class="art"></div><div class="notice"><span class="moon">☾</span><span>Playlist is disabled due to the screen being off</span></div></div>
<div class="progress"></div>
<div class="controls">
<div class="row"><button class="ctrl">↝</button><button class="ctrl">|◀</button><button class="ctrl primary">Ⅱ</button><button class="ctrl">▶|</button><button class="ctrl">▱</button><button class="ctrl">⚙</button></div>
<div class="volume"><div class="icon">◖))</div><input id="vol" type="range" min="0" max="100" value="53"><span><b id="vv">53</b>%</span></div>
<div class="lab"><div class="labtop"><span>Theme transition test</span><span id="transitionLabel">Silk Sweep</span></div><div class="themes"><button class="theme" data-theme-btn="forest" aria-pressed="true">🌲 Forest</button><button class="theme" data-theme-btn="witch" aria-pressed="false">✦ Witchy</button></div></div>
</div></section>
<footer><span>taiji.local</span></footer>
<div class="drawerShade" id="shade"></div><aside class="drawer" id="drawer"><button class="menu" id="close">×</button><h2>Theme Lab</h2><p>Choose a theme and compare several smooth transition styles. These avoid animated CSS masks, which can flicker in mobile Safari.</p><div class="themes"><button class="theme" data-theme-btn="forest">🌲 Forest</button><button class="theme" data-theme-btn="witch">✦ Witchy</button></div><div class="transition-setting"><label for="transitionStyle">Transition style</label><select id="transitionStyle"><option value="silk">Silk Sweep</option><option value="veil">Soft Veil</option><option value="velvet">Velvet Cascade</option><option value="diagonal">Gentle Diagonal</option><option value="fade">Glass Fade</option></select><div class="transition-desc" id="transitionDesc"></div></div><div class="speed"><label><span>Transition speed</span><b><span id="sv">460</span> ms</b></label><input id="speed" type="range" min="300" max="650" step="10" value="460"></div></aside>
</div></main>
<script>
const app=document.querySelector("#app"),root=document.documentElement,drawer=document.querySelector("#drawer"),shade=document.querySelector("#shade");
const speed=document.querySelector("#speed"),sv=document.querySelector("#sv"),transitionStyle=document.querySelector("#transitionStyle"),transitionDesc=document.querySelector("#transitionDesc"),transitionLabel=document.querySelector("#transitionLabel");
let busy=false;

const transitions={
  silk:{name:"Silk Sweep",desc:"A smooth diagonal wash with three translucent layers creating a wide feathered edge.",layers:[
    {opacity:.12,top0:3,bottom0:-28,top1:158,bottom1:127,easing:"cubic-bezier(.20,.78,.24,1)"},
    {opacity:.34,top0:-8,bottom0:-39,top1:147,bottom1:116,easing:"cubic-bezier(.21,.80,.24,1)"},
    {opacity:1,top0:-20,bottom0:-51,top1:136,bottom1:105,easing:"cubic-bezier(.22,.82,.25,1)",core:true}
  ]},
  veil:{name:"Soft Veil",desc:"A broader, quieter wash with a long soft overlap and almost no visible edge.",speed:1.12,layers:[
    {opacity:.08,top0:14,bottom0:-24,top1:166,bottom1:128,easing:"cubic-bezier(.18,.72,.22,1)"},
    {opacity:.20,top0:1,bottom0:-37,top1:153,bottom1:115,easing:"cubic-bezier(.20,.76,.23,1)"},
    {opacity:.44,top0:-11,bottom0:-49,top1:142,bottom1:104,easing:"cubic-bezier(.22,.80,.24,1)"},
    {opacity:1,top0:-24,bottom0:-62,top1:130,bottom1:92,easing:"cubic-bezier(.24,.84,.25,1)",core:true}
  ]},
  velvet:{name:"Velvet Cascade",desc:"Three overlapping diagonal passes arrive a few milliseconds apart for a soft cascading feel.",speed:1.04,layers:[
    {opacity:.16,top0:5,bottom0:-28,top1:154,bottom1:121,delay:0,easing:"cubic-bezier(.16,.76,.24,1)"},
    {opacity:.42,top0:-8,bottom0:-41,top1:144,bottom1:111,delay:24,easing:"cubic-bezier(.20,.80,.25,1)"},
    {opacity:1,top0:-22,bottom0:-55,top1:134,bottom1:101,delay:48,easing:"cubic-bezier(.24,.84,.26,1)",core:true}
  ]},
  diagonal:{name:"Gentle Diagonal",desc:"A simple clean diagonal reveal with no glow, mask, blur, or extra layers.",layers:[
    {opacity:1,top0:-18,bottom0:-49,top1:136,bottom1:105,easing:"cubic-bezier(.22,.82,.25,1)",core:true}
  ]},
  fade:{name:"Glass Fade",desc:"A calm full-screen crossfade with no moving edge at all.",speed:.82,fade:true}
};

function buttons(t){document.querySelectorAll("[data-theme-btn]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.themeBtn===t))}
function clip(top,bottom){return "polygon(0 0,"+top+"% 0,"+bottom+"% 100%,0 100%)"}
function updateTransitionUI(){
  const def=transitions[transitionStyle.value]||transitions.silk;
  transitionDesc.textContent=def.desc;
  transitionLabel.textContent=def.name;
  try{localStorage.setItem("df-transition-style",transitionStyle.value)}catch{}
}
function makeClone(nextTheme,opacity){
  const c=app.cloneNode(true);
  c.removeAttribute("id");
  c.classList.add("clone");
  c.dataset.theme=nextTheme;
  c.setAttribute("aria-hidden","true");
  c.style.opacity=String(opacity);
  c.querySelectorAll("[id]").forEach(e=>e.removeAttribute("id"));
  const copiedContent=c.querySelector(".content");
  if(copiedContent&&window.scrollY) copiedContent.style.transform="translateY(-"+window.scrollY+"px)";
  document.body.append(c);
  return c;
}
function finishTheme(nextTheme,copies){
  app.dataset.theme=nextTheme;
  buttons(nextTheme);
  document.querySelector('meta[name="theme-color"]').content=nextTheme==="forest"?"#07130f":"#060510";
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    copies.forEach(c=>c.remove());
    busy=false;
  }));
}
function change(nextTheme){
  if(busy||app.dataset.theme===nextTheme)return;
  busy=true;
  const def=transitions[transitionStyle.value]||transitions.silk;
  const baseMs=Number(speed.value)||460;
  const duration=Math.round(baseMs*(def.speed||1));
  const copies=[];

  if(def.fade){
    const c=makeClone(nextTheme,0);
    copies.push(c);
    const a=c.animate([{opacity:0},{opacity:1}],{duration,easing:"cubic-bezier(.22,.72,.24,1)",fill:"forwards"});
    a.addEventListener("finish",()=>finishTheme(nextTheme,copies),{once:true});
    return;
  }

  let coreAnimation=null;
  def.layers.forEach(layer=>{
    const c=makeClone(nextTheme,layer.opacity);
    copies.push(c);
    const a=c.animate([
      {clipPath:clip(layer.top0,layer.bottom0)},
      {clipPath:clip(layer.top1,layer.bottom1)}
    ],{
      duration,
      delay:layer.delay||0,
      easing:layer.easing,
      fill:"forwards"
    });
    if(layer.core)coreAnimation=a;
  });
  if(coreAnimation)coreAnimation.addEventListener("finish",()=>finishTheme(nextTheme,copies),{once:true});
}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-theme-btn]");
  if(b&&!b.closest(".clone"))change(b.dataset.themeBtn);
});
document.querySelector("#menu").onclick=()=>{drawer.classList.add("open");shade.classList.add("open")};
function close(){drawer.classList.remove("open");shade.classList.remove("open")}
document.querySelector("#close").onclick=close;shade.onclick=close;
document.querySelector("#vol").oninput=e=>document.querySelector("#vv").textContent=e.target.value;
speed.oninput=e=>{sv.textContent=e.target.value;try{localStorage.setItem("df-transition-speed",e.target.value)}catch{}};
transitionStyle.onchange=updateTransitionUI;

try{
  const savedStyle=localStorage.getItem("df-transition-style");
  const savedSpeed=localStorage.getItem("df-transition-speed");
  if(savedStyle&&transitions[savedStyle])transitionStyle.value=savedStyle;
  if(savedSpeed){speed.value=savedSpeed;sv.textContent=savedSpeed}
}catch{}
updateTransitionUI();
</script>
</body></html>
